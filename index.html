<title>Archive Clock</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
  :root {
    --bg: #ffffff;
    --ink: #37352f;
    --muted: #787774;
    --accent: #3c6e59;
    --danger: #b3492f;
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #191919;
      --ink: #d4d4d4;
      --muted: #9b9b9b;
      --accent: #78b399;
      --danger: #e2896c;
      color-scheme: dark;
    }
  }

  :root[data-theme="dark"] {
    --bg: #191919;
    --ink: #d4d4d4;
    --muted: #9b9b9b;
    --accent: #78b399;
    --danger: #e2896c;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--ink);
    font-family: 'IBM Plex Sans', system-ui, sans-serif;
    font-size: 0.95rem;
    min-height: 100%;
    max-width: 460px;
    margin: 0 auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 20px;
  }

  .archive {
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .top-row {
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .today-btn {
    font-size: 1rem;
    line-height: 1;
    background: none;
    border: none;
    color: var(--muted);
    cursor: pointer;
    padding: 2px;
    border-radius: 4px;
  }

  .today-btn:hover {
    color: var(--accent);
  }

  .archive-label {
    font-family: 'IBM Plex Sans', sans-serif;
    font-weight: 600;
    font-size: 0.95rem;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    padding: 2px 0;
  }

  .date-line {
    display: flex;
    align-items: baseline;
    gap: 6px;
    flex-wrap: wrap;
  }

  .date-line .label {
    color: var(--muted);
    font-size: 0.88rem;
  }

  .date-input {
    font-family: 'Fraunces', Georgia, serif;
    font-size: 1.3rem;
    font-weight: 500;
    font-variant-numeric: tabular-nums;
    color: var(--ink);
    background: transparent;
    border: none;
    outline: none;
    padding: 0;
  }

  .date-input[data-invalid="true"] {
    color: var(--danger);
  }

  .date-input::placeholder {
    color: var(--muted);
    opacity: 0.55;
  }

  .result {
    font-size: 0.82rem;
    color: var(--muted);
  }

  .result .num {
    font-family: 'IBM Plex Mono', monospace;
    font-weight: 600;
    font-variant-numeric: tabular-nums;
    color: var(--accent);
  }

  .result[data-state="error"] {
    color: var(--danger);
  }

  .today-btn:focus-visible,
  .date-input:focus-visible,
  .archive-label:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }
</style>

<div class="archive" data-archive="a">
  <div class="top-row">
    <button class="today-btn" id="today-a" type="button" title="Use today's date">◯</button>
    <input class="archive-label" id="label-a" value="Archive 1" />
  </div>
  <div class="date-line">
    <span class="label">Archived on:</span>
    <input class="date-input" id="date-a" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" maxlength="10" />
  </div>
  <div class="result" id="result-a" data-state="empty"></div>
</div>

<div class="archive" data-archive="b">
  <div class="top-row">
    <button class="today-btn" id="today-b" type="button" title="Use today's date">◯</button>
    <input class="archive-label" id="label-b" value="Archive 2" />
  </div>
  <div class="date-line">
    <span class="label">Archived on:</span>
    <input class="date-input" id="date-b" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" maxlength="10" />
  </div>
  <div class="result" id="result-b" data-state="empty"></div>
</div>

<div class="archive" data-archive="c">
  <div class="top-row">
    <button class="today-btn" id="today-c" type="button" title="Use today's date">◯</button>
    <input class="archive-label" id="label-c" value="Archive 3" />
  </div>
  <div class="date-line">
    <span class="label">Archived on:</span>
    <input class="date-input" id="date-c" inputmode="numeric" autocomplete="off" placeholder="MM/DD/YYYY" maxlength="10" />
  </div>
  <div class="result" id="result-c" data-state="empty"></div>
</div>

<script>
(function () {
  function pad(n) { return String(n).padStart(2, '0'); }

  function formatMMDDYYYY(y, m, d) {
    return pad(m) + '/' + pad(d) + '/' + y;
  }

  function maskInput(raw) {
    var digits = raw.replace(/\D/g, '').slice(0, 8);
    if (digits.length > 4) {
      return digits.slice(0, 2) + '/' + digits.slice(2, 4) + '/' + digits.slice(4);
    }
    if (digits.length > 2) {
      return digits.slice(0, 2) + '/' + digits.slice(2);
    }
    return digits;
  }

  function parseDate(str) {
    var m = str.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
    if (!m) return null;
    var month = parseInt(m[1], 10), day = parseInt(m[2], 10), year = parseInt(m[3], 10);
    if (month < 1 || month > 12) return null;
    var daysInMonth = new Date(year, month, 0).getDate();
    if (day < 1 || day > daysInMonth) return null;
    if (year < 1900 || year > 2100) return null;
    return { year: year, month: month, day: day };
  }

  function daysBetween(entered) {
    var now = new Date();
    var todayUTC = Date.UTC(now.getFullYear(), now.getMonth(), now.getDate());
    var enteredUTC = Date.UTC(entered.year, entered.month - 1, entered.day);
    return Math.round((todayUTC - enteredUTC) / 86400000);
  }

  function autosize(input) {
    input.size = Math.max(input.value.length, 1);
  }

  function createTracker(id, defaultLabel, sampleOffsetDays) {
    var input = document.getElementById('date-' + id);
    var label = document.getElementById('label-' + id);
    var result = document.getElementById('result-' + id);
    var todayBtn = document.getElementById('today-' + id);
    var DATE_KEY = 'archive-clock:date:' + id;
    var LABEL_KEY = 'archive-clock:label:' + id;

    function render() {
      var val = input.value.trim();
      input.setAttribute('data-invalid', 'false');
      autosize(input);

      if (!val) {
        result.textContent = 'Enter a date above.';
        result.setAttribute('data-state', 'empty');
        return;
      }

      var parsed = parseDate(val);
      if (!parsed) {
        result.textContent = "That date doesn't look right yet.";
        result.setAttribute('data-state', 'error');
        input.setAttribute('data-invalid', 'true');
        return;
      }

      var diff = daysBetween(parsed);
      result.setAttribute('data-state', 'ok');

      if (diff === 0) {
        result.textContent = 'Archived today';
      } else if (diff === 1) {
        result.innerHTML = '<span class="num">1</span> day ago';
      } else if (diff > 1) {
        result.innerHTML = '<span class="num">' + diff.toLocaleString() + '</span> days ago';
      } else if (diff === -1) {
        result.innerHTML = '<span class="num">1</span> day from now';
      } else {
        result.innerHTML = '<span class="num">' + Math.abs(diff).toLocaleString() + '</span> days from now';
      }

      try { localStorage.setItem(DATE_KEY, val); } catch (e) {}
    }

    input.addEventListener('input', function (e) {
      e.target.value = maskInput(e.target.value);
      render();
    });

    todayBtn.addEventListener('click', function () {
      var now = new Date();
      input.value = formatMMDDYYYY(now.getFullYear(), now.getMonth() + 1, now.getDate());
      render();
      input.focus();
    });

    label.addEventListener('input', function () {
      try { localStorage.setItem(LABEL_KEY, label.value); } catch (e) {}
    });

    var storedDate = '';
    var storedLabel = '';
    try {
      storedDate = localStorage.getItem(DATE_KEY) || '';
      storedLabel = localStorage.getItem(LABEL_KEY) || '';
    } catch (e) {}

    label.value = storedLabel || defaultLabel;

    if (!storedDate) {
      var now = new Date();
      var sample = new Date(now.getFullYear(), now.getMonth(), now.getDate() - sampleOffsetDays);
      storedDate = formatMMDDYYYY(sample.getFullYear(), sample.getMonth() + 1, sample.getDate());
    }

    input.value = storedDate;
    render();
  }

  createTracker('a', 'Archive 1', 20);
  createTracker('b', 'Archive 2', 60);
  createTracker('c', 'Archive 3', 90);
})();
</script>
